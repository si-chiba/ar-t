<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>チーバくん AR - ローカル実行版</title>
    
    <script src="aframe.min.js"></script>
    <script src="aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #000; }

        /* スタート画面 */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4c97ff, #3373cc);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            color: white; text-align: center; padding: 20px; box-sizing: border-box;
        }

        .start-button {
            background-color: #ffab19; color: white; border: none;
            padding: 20px 50px; font-size: 24px; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #cf8b12;
            transition: transform 0.1s;
        }
        .start-button:active { transform: translateY(4px); box-shadow: 0 2px 0 #cf8b12; }

        /* UIレイヤー（案内テキスト） */
        #ui-layer {
            position: fixed; top: 40px; left: 0; width: 100%;
            z-index: 1000; text-align: center; pointer-events: none;
            display: none; transition: opacity 0.5s;
        }

        .guide-text {
            display: inline-block; background: rgba(0,0,0,0.8); color: white;
            padding: 15px 30px; border-radius: 50px; font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .hide { opacity: 0 !important; }

        /* ARコンテナ */
        #ar-scene-container { visibility: hidden; }
        
        /* A-Frameが自動生成するビデオ要素を確実に背面に送る */
        video { position: fixed !important; top: 0 !important; left: 0 !important; z-index: -1 !important; }
    </style>
</head>

<body>

    <div id="start-screen">
        <h1 style="font-size: 28px; margin-bottom: 10px;">チーバくんと写真をとろう！</h1>
        <p style="font-size: 16px; margin-bottom: 30px; opacity: 0.9;">
            「スタート！」を押すとカメラが起動します。<br>
            ブラウザの「許可」ボタンを押してね！
        </p>
        <button class="start-button" onclick="startAR()">スタート！</button>
    </div>

    <div id="ui-layer">
        <div class="guide-text">📸 スクリーンショットで撮影してね！</div>
    </div>

    <div id="ar-scene-container">
        <a-scene embedded 
            
                 arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            
            <a-assets>
                <img id="my-image" src="chiba-kun.png">
            </a-assets>

            <a-marker id="target-marker" type="pattern" url="pattern-marker.patt">
                <a-image 
                    src="#my-image" 
                    width="1" height="1.48"
                    rotation="-90 0 0" 
                    position="0 0.2 0" 
                    scale="5 5 5"
                    material="transparent: true; alphaTest: 0.5; side: double;">
                </a-image>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <script>
        function startAR() {
            // UIの切り替え
            const startScreen = document.getElementById('start-screen');
            const container = document.getElementById('ar-scene-container');
            const uiLayer = document.getElementById('ui-layer');
            const scene = document.querySelector('a-scene');
            const marker = document.getElementById('target-marker');

            startScreen.style.display = 'none';
            container.style.visibility = 'visible';

            // iOS/Chrome対策：リサイズを複数回実行してカメラ描画を強制する
            const triggerResize = () => {
                window.dispatchEvent(new Event('resize'));
            };
            
            setTimeout(triggerResize, 300);
            setTimeout(triggerResize, 1000);
            setTimeout(triggerResize, 2000);

            // シーンのロード完了を待ってからマーカー監視を開始
            const onSceneLoaded = () => {
                console.log("AR Scene Ready");
                
                marker.addEventListener('markerFound', () => {
                    console.log("Marker Detected");
                    uiLayer.style.display = 'block';
                    uiLayer.classList.remove('hide');

                    // 4秒後に案内をフェードアウト
                    setTimeout(() => {
                        uiLayer.classList.add('hide');
                    }, 4000);
                });
            };

            if (scene.hasLoaded) {
                onSceneLoaded();
            } else {
                scene.addEventListener('loaded', onSceneLoaded);
            }
        }

        // 画面タップでメッセージ再表示（UIレイヤーが表示されている時のみ）
        window.addEventListener('click', () => {
            const uiLayer = document.getElementById('ui-layer');
            if (uiLayer.style.display === 'block') {
                uiLayer.classList.remove('hide');
                setTimeout(() => {
                    uiLayer.classList.add('hide');
                }, 3000);
            }
        });
    </script>
</body>
</html>
